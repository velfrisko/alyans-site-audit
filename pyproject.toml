[project]
name = "dealer-site-audit"
version = "0.1.0"
description = "ИИ-агент аудита сайтов автодилера: конверсия, карточки авто, техника, SEO, конкуренты"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "httpx>=0.27", "Jinja2>=3.1", "PyYAML>=6.0"]

[project.scripts]
dealer-audit = "dealer_audit.cli:main"

[tool.setuptools]
packages = ["dealer_audit", "dealer_audit.checks"]

[tool.setuptools.package-data]
dealer_audit = ["detectors.js", "templates/*.j2"]
