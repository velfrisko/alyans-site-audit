# Реестр сайтов холдинга. Агент работает и на любом URL вне списка: python -m dealer_audit run https://example.ru
# type: new — новые авто бренда; used — авто с пробегом; import — авто под заказ из-за рубежа; group — портал холдинга
defaults:
  city: Чебоксары
  competitors:            # 2–3 местных дилера для сравнения (можно переопределить у сайта)
    - {name: "ТТС Чебоксары", url: "https://cheboksary.tts.ru/"}
    - {name: "Chery Центр (АТК Моторс)", url: "https://chery-atkmotors.ru/"}
    - {name: "Тойота Центр Чебоксары", url: "https://toyota-cheb.tts.ru/"}

